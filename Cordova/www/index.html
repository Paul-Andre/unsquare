<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<title> Unsquare </title>
        
	<!-- CSS -->
  <link href='https://fonts.googleapis.com/css?family=Passion+One:700' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="main.css">


  <!-- Scripts -->
  <script src="jquery-3.1.0.min.js"></script>
  <script src="api.js"></script>
  <script src="Grid.js"></script>
  <script src="colors.js"></script>
  <script src="gameBase.js"></script>
  <script src="levelDataManager.js"></script>
  <script src="shapes.js"></script>
  <script src="icon.js"></script>
  <script src="helpers.js"></script>
  <script src="levelMenu.js"></script>
  <script src="screenManager.js"></script>
  <script src="bookMenu.js"></script>
  <script src="drawing.js"></script>
  <script src="exportSave.js"></script>
  <script src="loading.js"></script>
  <script src="level.js"></script>
</head>

<body>
  <section id="home">
    <div class="header">
      <h1>
        Unsquare
      </h1>
    </div>

    <div class="wrapper">
      <button class="btn-default btn pulse-button toBookMenu" onclick="screenManager.switchTo('bookMenu');" type="button">
        Play
      </button>
      <button class="btn btn-default toOptions" id="adjustment" type="button">
        Options
      </button>
      <button class="btn btn-default" onclick="screenManager.switchTo('about');" type="button">
        Credits
      </button>
    </div>

    <div class="footer">
    </div>
  </section>

  <section id="options">
    <div class="header">
      <h1>
        Options
      </h1>
      <img src="back7.svg" class="back">
    </div>

    <div class="options-content">
      <h1> Sound Effects </h1>
      <div class="radio">
        <form action="">
        <input type="radio" name="rdo" id="yessfx" checked />
        <input type="radio" name="rdo" id="nosfx"/>
        <div class="switch">
          <label for="yessfx">On</label>
          <label for="nosfx">Off</label>
          <span></span>
        </div>
      </form>
      </div>
      <h1 id="music"> Music </h1>
      <div class="radio">
        <form action="">
        <input type="radio" name="rdo" id="yesmusic" checked />
        <input type="radio" name="rdo" id="nomusic"/>
        <div class="switch">
          <label for="yesmusic">On</label>
          <label for="nomusic">Off</label>
          <span></span>
      </div>
      </form>
    </div>
    </div>
  </section>

  <section id="about">
    <div class="header">
      <h1>
        Credits
      </h1>
      <button class="back">
        &#8592;
      </button>
    </div>

    <div class="content">
      <p>
        <table>
          <tr>
            <td>Original Idea</td>
            <td>Paul-Andre Henegar</td>
          </tr>
          <tr>
            <td>Styling</td>
            <td>James Brace</td>
          </tr>
          <tr>
            <td>Random Restructuring</td>
            <td>Youri Tamitegama</td>
          </tr>
          <tr>
            <td>SFX/Marketing</td>
            <td><a href="http://facebook.com/hyroglyphik">Hyroglyphik games {{ logo or whatever }}</a></td>
          </tr>
        </table>
      </p>
    </div>

    <div class="footer">
    </div>
  </section>

  <section id="bookMenu">
    <div class="header">
      <h1>
        Books
      </h1>
      <button class="back">
        &#8592;
      </button>
    </div>

    <div id="bookContainer" class="content">
    </div>

    <div class="footer">
    </div>
  </section>

  <section id="levelMenu">
    <div class="header">
      <h1>
        Chapters
      </h1>
      <button class="back">
        &#8592;
      </button>
    </div>

    <div class="content">
      {{ levelList }}
    </div>

    <div class="footer">
    </div>
  </section>

  <section id="game">
    <div class="header">
      <h1>
        {{ Name }}
      </h1>
      <button class="back">
        &#8592;
      </button>
      <div id="stats">
        
      </div>
    </div>

    <div class="content">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="footer">
      <button id="prevLevel">
        &#8592;
      </button>
      <button id="restartLevel">
        Restart
      </button>
      <button id="hint">
        Hint
      </button>
      <button id="nextLevel">

      </button>
    </div>
  </section>

  <section id="loading">
    <p>
      Loading
    </p>
  </section>
</body>
</html>
