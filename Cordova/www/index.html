<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<link rel="stylesheet" type="text/css" href="style2.css">
	<title> Unsquare </title>
        <script src="http://code.jquery.com/jquery-3.1.0.min.js"></script>
	<script src="api.js"></script>
	<script src="Grid.js"></script>
	<script src="colors.js"></script>
	<script src="shapes.js"></script>
	<script src="icon.js"></script>
	<script src="helpers.js"></script>
	<script src="screenManager.js"></script>
	<script src="bookMenu.js"></script>
	<script src="drawing.js"></script>
	<script src="exportSave.js"></script>
	<script src="loading.js"></script>
	<script src="level.js"></script>
</head>

<body>
  <section id="Home">
    <div class="header">
      <h1>
        Unsquare
      </h1>
    </div>

    <div class="content">
      <button id="toPlay">
        Play now!
      </button>
      <button id="toOptions">
        Options
      </button>
      <button id="toAbout">
        About
      </button>
    </div>

    <div class="footer">
    </div>
  </section>

  <section id="Options">
    <div class="header">
      <h1>
        Options
      </h1>
      <button class="back">
        &zwnj;
      </button>
    </div>

    <div class="content">
      <div>
        <label for="sfx">
          Sound Effects
        </label>
        <input id="sfx" type="checkbox">
      </div>

      <div>
        <label for="music">
          Sound Effects
        </label>
        <input id="music" type="checkbox">
      </div>
    </div>

    <div class="footer">
      <button id="saveOptions">
        Save
      </button>
    </div>
  </section>

  <section id="About">
    <div class="header">
      <h1>
        Credits
      </h1>
      <button class="back">
        &zwnj;
      </button>
    </div>

    <div class="content">
      <p>
        bla bla bla
      </p>
    </div>

    <div class="footer">
    </div>
  </section>

  <section id="Books">
    <div class="header">
      <h1>
        Books
      </h1>
      <button class="back">
        &zwnj;
      </button>
    </div>

    <div class="content">
      {{ BookList }}
    </div>

    <div class="footer">
    </div>
  </section>

  <section id="Chapters">
    <div class="header">
      <h1>
        Chapters
      </h1>
      <button class="back">
        &zwnj;
      </button>
    </div>

    <div class="content">
      {{ ChapterList }}
    </div>

    <div class="footer">
    </div>
  </section>

  <section id="Game">
    <div class="header">
      <h1>
        {{ Name }}
      </h1>
      <button class="back">
        &zwnj;
      </button>
      <div id="stats">
        
      </div>
    </div>

    <div class="content">
    </div>

    <div class="footer">
      <button id="prevLevel">
        &zwnj;
      </button>
      <button id="restartLevel">
        Restart
      </button>
      <button id="hint">
        Hint
      </button>
      <button id="nextLevel">

      </button>
    </div>
  </section>

  <section id="loading">
    <p>
      Loading
    </p>
  </section>
</body>
</html>
