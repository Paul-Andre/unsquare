<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<title> Unsquare </title>
        
	<!-- CSS -->
  <link href='https://fonts.googleapis.com/css?family=Passion+One:700' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="main.css">


  <!-- Scripts -->
  <script src="jquery-3.1.0.min.js"></script>
  <script src="api.js"></script>
  <script src="Grid.js"></script>
  <script src="colors.js"></script>
  <script src="gameBase.js"></script>
  <script src="levelDataManager.js"></script>
  <script src="shapes.js"></script>
  <script src="icon.js"></script>
  <script src="helpers.js"></script>
  <script src="levelMenu.js"></script>
  <script src="screenManager.js"></script>
  <script src="bookMenu.js"></script>
  <script src="drawing.js"></script>
  <script src="exportSave.js"></script>
  <script src="loading.js"></script>
  <script src="level.js"></script>
</head>

<body>
  <section id="Home">
    <div class="header">
      <h1>
        Unsquare
      </h1>
    </div>

    <div class="wrapper">
      <button class="btn-default btn pulse-button toBooks" type="button">
        Play now!
      </button>
      <button class="btn btn-default toOptions" type="button">
        Options
      </button>
      <button class="btn btn-default" onclick="screenManager.switchTo('About');" type="button">
        About
      </button>
    </div>

    <div class="footer">
    </div>
  </section>

  <section id="Options">
    <div class="header">
      <h1>
        Options
      </h1>
      <button class="back">
        &#8592;
      </button>
    </div>

    <div class="content">
      <div>
        <label for="sfx">
          Sound Effects
        </label>
        <input id="sfx" type="checkbox">
      </div>

      <div>
        <label for="music">
          Music
        </label>
        <input id="music" type="checkbox">
      </div>
    </div>

    <div class="footer">
      <button id="saveOptions">
        Save
      </button>
    </div>
  </section>

  <section id="About">
    <div class="header">
      <h1>
        Credits
      </h1>
      <button class="back">
        &#8592;
      </button>
    </div>

    <div class="content">
      <p>
        bla bla bla
      </p>
    </div>

    <div class="footer">
    </div>
  </section>

  <section id="Books">
    <div class="header">
      <h1>
        Books
      </h1>
      <button class="back">
        &#8592;
      </button>
    </div>

    <div id="bookContainer" class="content">
    </div>

    <div class="footer">
    </div>
  </section>

  <section id="Levels">
    <div class="header">
      <h1>
        Chapters
      </h1>
      <button class="back">
        &#8592;
      </button>
    </div>

    <div class="content">
      {{ levelList }}
    </div>

    <div class="footer">
    </div>
  </section>

  <section id="Game">
    <div class="header">
      <h1>
        {{ Name }}
      </h1>
      <button class="back">
        &#8592;
      </button>
      <div id="stats">
        
      </div>
    </div>

    <div class="content">
      <canvas id="gamCanvas"></canvas>
    </div>

    <div class="footer">
      <button id="prevLevel">
        &#8592;
      </button>
      <button id="restartLevel">
        Restart
      </button>
      <button id="hint">
        Hint
      </button>
      <button id="nextLevel">

      </button>
    </div>
  </section>

  <section id="loading">
    <p>
      Loading
    </p>
  </section>
</body>
</html>
